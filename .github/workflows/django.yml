name: Django CI

on:
  push:
    branches: [ "main", "v2" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up docker
      uses: docker/setup-buildx-action@v2

    - name: Run Tests
      run: |
        make test-coverage
